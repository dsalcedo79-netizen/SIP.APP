<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIP · Maestría de Vida</title>
<style>
  :root{
    --verde:#1f5c4d; --verde-osc:#153f35; --dorado:#c9a227; --crema:#faf7f2;
    --blanco:#ffffff; --texto:#2b2b2b; --gris:#8a857c; --linea:#e8e2d6;
    --rojo:#b0503c; --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--crema); color:var(--texto); font-family:'Segoe UI',system-ui,-apple-system,sans-serif; min-height:100vh;}
  header{background:var(--verde); color:#fff; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;}
  header h1{font-size:1.1rem; font-weight:600; letter-spacing:.5px;}
  header h1 span{color:var(--dorado);}
  header .fecha{font-size:.78rem; opacity:.85;}
  .viaje{background:var(--verde-osc); display:flex; overflow-x:auto; padding:8px 10px; gap:6px; position:sticky; top:0; z-index:10;}
  .viaje .paso{flex:1; min-width:106px; text-align:center; color:#9db8b0; font-size:.7rem; padding:7px 6px; border-radius:10px; cursor:pointer; border:1px solid transparent; white-space:nowrap;}
  .viaje .paso b{display:block; font-size:.8rem; color:#cfe0da;}
  .viaje .paso.activo{background:rgba(201,162,39,.15); border-color:var(--dorado);}
  .viaje .paso.activo b{color:#fff;}
  .viaje .paso.hecho b::after{content:" ✓"; color:var(--dorado);}
  .viaje .paso.bloq{opacity:.4;}
  main{max-width:880px; margin:0 auto; padding:20px 16px 60px;}
  .card{background:var(--blanco); border:1px solid var(--linea); border-radius:var(--radius); padding:20px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .card h2{font-size:1.05rem; color:var(--verde); margin-bottom:12px;}
  .card h3{font-size:.92rem; color:var(--verde-osc); margin:10px 0 6px;}
  .sub{color:var(--gris); font-size:.85rem; margin-bottom:10px;}
  .lema{font-size:.72rem; letter-spacing:.8px; color:var(--dorado); text-transform:uppercase; margin-bottom:6px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:12px;}
  .kpi{background:var(--blanco); border:1px solid var(--linea); border-radius:var(--radius); padding:14px; text-align:center;}
  .kpi .num{font-size:1.5rem; font-weight:700; color:var(--verde);}
  .kpi .lbl{font-size:.74rem; color:var(--gris); margin-top:4px;}
  button.btn{background:var(--verde); color:#fff; border:none; border-radius:10px; padding:10px 18px; font-size:.9rem; cursor:pointer;}
  button.btn:hover{background:var(--verde-osc);}
  button.btn:disabled{opacity:.5; cursor:not-allowed;}
  button.btn-sec{background:none; border:1px solid var(--verde); color:var(--verde); border-radius:10px; padding:8px 14px; font-size:.85rem; cursor:pointer;}
  button.btn-mini{background:none; border:none; color:var(--gris); cursor:pointer; font-size:.85rem;}
  input[type=text], input[type=password], input[type=number], input[type=date], select, textarea{width:100%; padding:10px; border:1px solid var(--linea); border-radius:10px; font-size:.9rem; font-family:inherit; background:#fffdf9;}
  textarea{min-height:60px; resize:vertical;}
  label.campo{display:block; font-size:.8rem; color:var(--verde-osc); font-weight:600; margin:10px 0 4px;}
  .fila{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .fila > *{flex:1;}
  .dim-fila{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px dashed var(--linea);}
  .dim-fila label{width:110px; font-size:.85rem;}
  .dim-fila input[type=range]{flex:1; accent-color:var(--verde);}
  .dim-fila .val{width:26px; text-align:center; font-weight:700; color:var(--verde);}
  input[type=range].avance{width:100%; accent-color:var(--verde);}
  .grupo-titulo{margin:14px 0 4px; font-size:.78rem; letter-spacing:1px; color:var(--dorado); text-transform:uppercase; font-weight:700;}
  .lista-item{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--linea);}
  .lista-item:last-child{border-bottom:none;}
  .tag{font-size:.7rem; background:#eef3f1; color:var(--verde); padding:3px 8px; border-radius:20px; white-space:nowrap;}
  .tag.dorado{background:#f7efd8; color:#8a6d10;}
  .estado{cursor:pointer; font-size:.75rem; padding:4px 10px; border-radius:20px; border:1px solid var(--linea); background:#fff;}
  .estado.en_progreso{background:#f7efd8; border-color:var(--dorado);}
  .estado.lograda{background:#e3efe9; border-color:var(--verde); color:var(--verde); font-weight:600;}
  .check{width:26px; height:26px; border-radius:8px; border:2px solid var(--verde); background:#fff; cursor:pointer; flex-shrink:0; font-size:16px; line-height:1;}
  .check.si{background:var(--verde); color:#fff;}
  .med-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:8px;}
  .med-dia{border:1px solid var(--linea); border-radius:10px; padding:8px 4px; text-align:center; font-size:.72rem; background:#fffdf9;}
  .med-dia .n{font-weight:700; font-size:.95rem; color:var(--verde);}
  .med-dia.hecha{background:var(--verde); color:#fff;}
  .med-dia.hecha .n{color:var(--dorado);}
  .med-dia.actual{border:2px solid var(--dorado);}
  .barra{height:10px; background:#eee7d9; border-radius:6px; overflow:hidden; margin:10px 0;}
  .barra div{height:100%; background:linear-gradient(90deg,var(--verde),var(--dorado));}
  .insight{border-left:4px solid var(--dorado); background:#fffbef; padding:12px 14px; border-radius:0 10px 10px 0; margin-bottom:10px; font-size:.9rem;}
  .centro{text-align:center;}
  .aviso{font-size:.78rem; color:var(--gris); font-style:italic;}
  details.area{border:1px solid var(--linea); border-radius:10px; margin-bottom:10px; background:#fffdf9;}
  details.area summary{padding:12px 14px; cursor:pointer; font-size:.9rem; font-weight:600; color:var(--verde-osc); list-style:none; display:flex; justify-content:space-between; align-items:center; gap:8px;}
  details.area summary::after{content:"▾"; color:var(--gris);}
  details.area[open] summary::after{content:"▴";}
  details.area .cuerpo{padding:0 14px 14px;}
  details.area .objetivo{font-size:.78rem; color:var(--gris); font-style:italic; font-weight:400;}
  .moods{display:flex; gap:8px; justify-content:center; margin:8px 0;}
  .moods button{font-size:1.5rem; background:#fffdf9; border:2px solid var(--linea); border-radius:12px; padding:5px 9px; cursor:pointer;}
  .moods button.sel{border-color:var(--dorado); background:#f7efd8;}
  .frase{background:linear-gradient(135deg,#1f5c4d,#153f35); color:#fff; border-radius:var(--radius); padding:18px 20px; margin-bottom:16px; text-align:center;}
  .frase .f{font-size:1rem; font-style:italic;}
  .frase .a{font-size:.7rem; color:var(--dorado); margin-top:6px; letter-spacing:1px; text-transform:uppercase;}
  .opcion{display:block; width:100%; text-align:left; background:#fffdf9; border:1px solid var(--linea); border-radius:10px; padding:9px 12px; margin-bottom:7px; cursor:pointer; font-size:.87rem;}
  .opcion.sel{border-color:var(--verde); background:#e3efe9; font-weight:600;}
  .estrellas button{background:none; border:none; font-size:1.5rem; cursor:pointer; filter:grayscale(1);}
  .estrellas button.on{filter:none;}
  .chat{display:flex; flex-direction:column; gap:10px; max-height:420px; overflow-y:auto; padding:10px 2px; margin-bottom:10px;}
  .msg{max-width:85%; padding:10px 14px; border-radius:14px; font-size:.9rem; line-height:1.45; white-space:pre-wrap;}
  .msg.user{align-self:flex-end; background:var(--verde); color:#fff; border-bottom-right-radius:4px;}
  .msg.coach{align-self:flex-start; background:#f0ede5; border-bottom-left-radius:4px;}
  .compuerta{border:1px dashed var(--dorado); background:#fffbef; border-radius:var(--radius); padding:18px; margin-bottom:16px;}
  .compuerta ul{margin:10px 0 0 20px; font-size:.88rem;}
  svg.radar{display:block; margin:0 auto; max-width:100%;}
  @media(max-width:600px){ .dim-fila label{width:96px; font-size:.78rem;} }
</style>
</head>
<body>
<header>
  <h1>SIP <span>·</span> Maestría de Vida</h1>
  <div class="fecha" id="hoyTxt"></div>
</header>
<div class="viaje" id="viaje"></div>
<main id="main"></main>
<script src="rueda.js"></script>
<script src="comunidad.js"></script>
<script src="app.js"></script>
</body>
</html>
